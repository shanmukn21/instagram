<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            border: 0;
        }

        body {
            font-family: sans-serif;
            background-color: black;
            color: white;
        }

        #mn {
            align-items: center;
        }

        #mn,
        #cretr {
            display: flex;
            flex-direction: column;
        }

        #dcret {
            grid-area: 1 / 1 / 6 / 2;
        }

        #hfr {
            justify-content: left;
        }

        #hdr {
            min-width: 935px;
            display: grid;
            padding-top: 16px;
            border-bottom: 0.8px solid rgb(38, 38, 38);
        }

        #nameh {
            grid-area: 1 / 2 / 2 / 3;
            align-items: center;
        }

        #accd {
            grid-area: 2 / 2 / 3 / 3;
        }

        #msd {
            grid-area: 3 / 2 / 4 / 2;
        }

        #threads {
            grid-area: 4 / 2 / 5 / 2;
        }

        #kf {
            grid-area: 5 / 2 / 6 / 5;
        }

        #nameh,
        #accd,
        #sect {
            display: flex;
            flex-direction: row;
        }

        #cret {
            margin: 25px auto;
            min-width: 150px;
            min-height: 150px;
            max-width: 150px;
            max-height: 150px;
            border-radius: 50%;
            background-image: url('https://pbs.twimg.com/media/FaKvLYYaMAEVT3n.jpg');
            background-size: cover;
        }

        #name {
            padding-right: 30px;
            font-size: 22px;
        }

        #threads {
            font-size: 14px;
            background-color: #363636;
            border-radius: 16px;
            padding: 7px 7px;
            max-width: fit-content;
        }

        #msd {
            margin-top: 16px;
            margin-bottom: 4px;
        }

        #kf {
            margin-top: 20px;
            margin-bottom: 50px;
            font-size: 12px;
            color: #A8A8A8;
            font-weight: 700;
        }

        #kf b {
            color: white;
        }

        #sect p {
            font-size: 12px;
            min-height: 52px;
            line-height: 3;
            border-top: 1px solid white;
        }

        section {
            min-width: 935px;
            max-width: 935px;
            gap: 12px;
            display: grid;
            grid-template-columns: repeat(3, 3fr);
            grid-template-rows: repeat(6, 3fr);
        }

        section div {
            background-image: url('https://instagram.fhyd11-3.fna.fbcdn.net/v/t39.30808-6/476226207_18500792371002792_862135340035619506_n.jpg?stp=dst-jpg_e35_s640x640_sh0.08_tt6&efg=eyJ2ZW5jb2RlX3RhZyI6ImltYWdlX3VybGdlbi4xNDQweDk2MC5zZHIuZjMwODA4LmRlZmF1bHRfaW1hZ2UifQ&_nc_ht=instagram.fhyd11-3.fna.fbcdn.net&_nc_cat=1&_nc_oc=Q6cZ2QGydyjdgwAhgB_YKdXsLPAu188Rt58n8so0FkxxKq_bmhs5C5jOssWeBL-J_KzMx02FiuHceg4IqTypbGPTmPne&_nc_ohc=k7KILwGn1esQ7kNvgGwYUoU&_nc_gid=aoVN1Ym8RGvrG3KSV50aGA&edm=ALQROFkAAAAA&ccb=7-5&ig_cache_key=MzQxMTk0NzgyMTYxOTQ2MzY4MA%3D%3D.3-ccb7-5&oh=00_AYETGGI3d8kXmkt8F3GBdw6heIjYTEEkp0zUbgwRklHipw&oe=67E17AFB&_nc_sid=fc8dfb');
            background-size: cover;
            aspect-ratio: 1 / 1;
        }

        #follow,
        #message,
        #perp {
            background-color: #363636;
            padding: 7px 16px;
            border-radius: 8px;
        }

        #perp {
            padding: 8px;
            max-width: 16px;
            max-height: 16px;
        }

        #mre {
            max-width: 32px;
            max-height: 32px;
        }

        @media (max-width:975px) {
            section {
                min-width: 100%;
                max-width: 100%;
            }

            #hdr {
                min-width: 100%;
                max-width: 100%;
            }

            #sect {
                width: 32%;
            }
        }

        @media (min-width:767px) {
            #hdr {
                grid-template-columns: 1fr 2fr;
            }

            #nameh p {
                margin: 20px 8px 20px 0px;
            }

            #accd p {
                margin-right: 32px;
            }

            #sect {
                justify-content: space-between;
            }

            #mn {
                padding: 20px;
            }
        }

        @media(min-width:975px) {
            #sect {
                min-width: 300px;
                max-width: 300px;
            }
        }

        @media (max-width:767px) {
            #hdr {
                grid-template-columns: 1fr 5fr;
            }

            #sect {
                width: 100%;
            }

            #sect {
                justify-content: space-around;
            }

            #hdr {
                width: 100%;
            }

            #dcret {
                margin-left: 16px;
                grid-area: 1 / 1 / 2 / 2;
            }

            #msd {
                margin-left: 16px;
                grid-area: 3 / 1 / 4 / 2;
            }

            #threads {
                margin-left: 16px;
                padding: 8px 7px;
                grid-area: 4 / 1 / 5 / 2;
            }

            #kf {
                margin-left: 16px;
                grid-area: 5 / 1 / 6 / 5;
                margin-bottom: 20px;
            }

            #accd {
                grid-area: 6 / 1 / 7 / 5;
                border-top: 0.8px solid rgb(38, 38, 38);
                display: grid;
                grid-template-columns: repeat(3, 3fr);
                padding: 12px 0px;

            }

            #accd p {
                display: flex;
                flex-direction: column;
                text-align: center;
            }

            #nameh {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr 2fr;
            }

            #name {
                margin: 0px;
                grid-area: 1 / 1 / 2 / 2;
                padding-right: 0px;
            }

            #mre {
                grid-area: 1 / 2 / 2 / 3;
            }

            #follow {
                margin: 20px 8px 20px 0px;
                grid-area: 2 / 1 / 3 / 2;
            }

            #message {
                margin: 20px 8px 20px 0px;
                grid-area: 2 / 2 / 3 / 3;
            }

            #perp {
                grid-area: 2 / 3 / 3 / 4;
            }

            #hdr {
                min-width: 100%;
            }

            #dcret {
                min-width: 76px;
                min-height: 92px;
            }

            #msd {
                margin-top: 0px;
            }

            #cret {
                margin: 0px;
                min-width: 77px;
                min-height: 77px;
                max-width: 77px;
                max-height: 77px;
            }

            #cretr {
                min-width: 0px;
                max-width: 300px;
                overflow: hidden;
                width: fit-content;
            }

            section {
                max-width: 100%;
                min-width: 100%;
                gap: 5px;
            }
        }
    </style>
</head>
